name: Check

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  harness:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runner
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn check-pins
      - run: cargo test --manifest-path runner/Cargo.toml
      - run: CALX_BENCH_QUICK=1 CALX_BENCH_SAMPLES=1 yarn bench
